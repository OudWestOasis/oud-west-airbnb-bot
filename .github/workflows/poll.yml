name: Commando's pollen

on:
  schedule:
    # Elke 5 min de openstaande Telegram-commando's ophalen en verwerken.
    # Kan GRATIS dankzij de PUBLIC repo (onbeperkte Actions-minuten).
    # (Sub-uur cron is "best effort"; lichte vertraging is normaal.)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # handmatige testknop (poll nu meteen)

permissions:
  contents: write

concurrency:
  group: airbnb-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Installeer dependencies
        run: pip install -r requirements.txt

      - name: Tick (commando's + weekcheck; stand-by als laptop actief)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_LOCATION: cloud
          LAPTOP_HEARTBEAT: ${{ vars.LAPTOP_HEARTBEAT }}
        run: python oasis_airbnb_bot.py tick

      - name: Commit bijgewerkte state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airbnb_state.json
          if git diff --cached --quiet; then
            echo "Geen state-wijziging — niets te committen."
            exit 0
          fi
          git commit -m "Update state (poll) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "State gepusht."; exit 0
            fi
            echo "Push poging $i mislukt, opnieuw..."; sleep 5
          done
          echo "Push definitief mislukt"; exit 1
